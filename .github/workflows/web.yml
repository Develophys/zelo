name: Web

on:
  push:
    branches: [main, develop]
    paths: &web-paths
      - 'apps/web/**'
      - 'packages/domain/**'
      - 'packages/config/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'turbo.json'
      - '.nvmrc'
      - '.npmrc'
      - '.github/workflows/web.yml'
  pull_request:
    paths: *web-paths

permissions:
  contents: read

concurrency:
  group: web-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  web-test:
    runs-on: ubuntu-latest
    env:
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ secrets.TURBO_TEAM }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies (web + shared packages only)
        run: pnpm install --frozen-lockfile --filter=@zelo/web...

      - name: Lint boundaries
        run: pnpm turbo run lint:boundaries --filter=@zelo/web...

      - name: Lint
        run: pnpm turbo run lint --filter=@zelo/web...

      - name: Test
        run: pnpm turbo run test --filter=@zelo/web...

      - name: Build
        run: pnpm turbo run build --filter=@zelo/web...
