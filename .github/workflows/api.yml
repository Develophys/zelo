name: API

on:
  push:
    branches: [main, develop]
    paths: &api-paths
      - 'apps/api/**'
      - 'packages/domain/**'
      - 'packages/config/**'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'turbo.json'
      - '.nvmrc'
      - '.npmrc'
      - 'fly.toml'
      - 'docker/api.Dockerfile'
      - '.dockerignore'
      - '.github/workflows/api.yml'
  pull_request:
    paths: *api-paths

permissions:
  contents: read

concurrency:
  group: api-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  api-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: zelo
          POSTGRES_PASSWORD: devpassword
          POSTGRES_DB: zelo
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://zelo:devpassword@localhost:5432/zelo?schema=public
      DIRECT_DATABASE_URL: postgresql://zelo:devpassword@localhost:5432/zelo?schema=public
      TURBO_TOKEN: ${{ secrets.TURBO_TOKEN }}
      TURBO_TEAM: ${{ secrets.TURBO_TEAM }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies (api + shared packages only)
        run: pnpm install --frozen-lockfile --filter=@zelo/api...

      - name: Generate Prisma Client
        run: pnpm --filter @zelo/api exec prisma generate

      - name: Lint boundaries
        run: pnpm turbo run lint:boundaries --filter=@zelo/api...

      - name: Lint
        run: pnpm turbo run lint --filter=@zelo/api...

      - name: Apply database migrations
        run: pnpm --filter @zelo/api exec prisma migrate deploy

      - name: Test
        run: pnpm turbo run test --filter=@zelo/api...

      - name: Build
        run: pnpm turbo run build --filter=@zelo/api...

  deploy-dev:
    needs: api-test
    if: github.ref == 'refs/heads/develop' && github.event_name == 'push'
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: ${{ secrets.DEV_DATABASE_URL }}
      DIRECT_DATABASE_URL: ${{ secrets.DEV_DIRECT_DATABASE_URL }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version-file: '.nvmrc'
          cache: 'pnpm'

      - name: Install dependencies (api + shared packages only)
        run: pnpm install --frozen-lockfile --filter=@zelo/api...

      - name: Generate Prisma Client
        run: pnpm --filter @zelo/api exec prisma generate

      - name: Apply database migrations (dev)
        run: pnpm --filter @zelo/api exec prisma migrate deploy

      - name: Setup flyctl
        uses: superfly/flyctl-actions/setup-flyctl@master

      - name: Deploy to Fly.io (dev)
        run: flyctl deploy --remote-only --config fly.dev.toml
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN_DEV }}

      - name: Verify deployment
        run: curl -sf https://zelo-api-dev.fly.dev/health | grep -q '"status":"ok"'
